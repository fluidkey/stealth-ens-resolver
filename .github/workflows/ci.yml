name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v0.3.0

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test (fails if gas snapshots change)
        run: forge test -vvv
        env:
          FORGE_SNAPSHOT_CHECK: true
          # Optional: the fork tests run only when these secrets are set (archive RPCs).
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}

      - name: Canonical build check
        run: ./script/verify-canonical-build.sh

      - name: ENSIP interface sync
        run: ./script/check-ensip-sync.sh
